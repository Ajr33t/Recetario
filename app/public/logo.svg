<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SazónLab">
  <defs>
    <linearGradient id="sl-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset="0.55" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#0369a1" />
    </linearGradient>
    <radialGradient id="sl-brillo" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base redondeada estilo Liquid Glass -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sl-fondo)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sl-brillo)" />
  <rect
    x="30"
    y="30"
    width="452"
    height="452"
    rx="98"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="6"
  />

  <!-- Gorro de chef (blanco) -->
  <g fill="#ffffff">
    <circle cx="196" cy="236" r="56" />
    <circle cx="256" cy="204" r="68" />
    <circle cx="316" cy="236" r="56" />
    <rect x="170" y="236" width="172" height="98" />
    <rect x="176" y="330" width="160" height="56" rx="18" />
  </g>
  <!-- Pliegues de la banda -->
  <g fill="#075985" fill-opacity="0.4">
    <rect x="226" y="342" width="9" height="32" rx="4.5" />
    <rect x="252" y="342" width="9" height="32" rx="4.5" />
    <rect x="278" y="342" width="9" height="32" rx="4.5" />
  </g>

  <!-- Destellos (IA / sazón) -->
  <g fill="#ffffff">
    <path
      d="M398 96 Q404 118 426 124 Q404 130 398 152 Q392 130 370 124 Q392 118 398 96 Z"
      fill-opacity="0.95"
    />
    <path
      d="M124 356 Q128 370 142 374 Q128 378 124 392 Q120 378 106 374 Q120 370 124 356 Z"
      fill-opacity="0.8"
    />
    <path
      d="M140 130 Q143 140 153 143 Q143 146 140 156 Q137 146 127 143 Q137 140 140 130 Z"
      fill-opacity="0.7"
    />
  </g>
</svg>
