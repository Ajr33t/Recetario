<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SazónLab">
  <defs>
    <linearGradient id="sl-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#c2410c" />
    </linearGradient>
    <radialGradient id="sl-brillo" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base redondeada estilo Liquid Glass -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sl-fondo)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#sl-brillo)" />
  <rect
    x="30"
    y="30"
    width="452"
    height="452"
    rx="98"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.35"
    stroke-width="6"
  />

  <!-- Vapor (tres hilos de aire caliente) -->
  <g fill="none" stroke="#fff7ed" stroke-width="18" stroke-linecap="round">
    <path d="M 190 198 C 164 168 214 148 190 118" stroke-opacity="0.95" />
    <path d="M 256 182 C 230 152 282 132 256 102" stroke-opacity="0.85" />
    <path d="M 322 198 C 296 168 346 148 322 118" stroke-opacity="0.95" />
  </g>

  <!-- Asas (detrás del cuerpo: sobresalen de los lados) -->
  <g fill="#fff7ed">
    <rect x="134" y="288" width="66" height="22" rx="11" />
    <rect x="312" y="288" width="66" height="22" rx="11" />
  </g>

  <!-- Cuerpo de la olla -->
  <path
    d="M 182 270 L 330 270 L 319 356 Q 316 380 294 380 L 218 380 Q 196 380 193 356 Z"
    fill="#fff7ed"
  />
  <!-- Sombra interior del fondo de la olla -->
  <rect x="204" y="342" width="104" height="18" rx="9" fill="#fed7aa" fill-opacity="0.55" />
  <!-- Separador entre tapa y cuerpo -->
  <rect x="176" y="274" width="160" height="8" rx="4" fill="#c2410c" fill-opacity="0.22" />

  <!-- Tapa: knob, cúpula y borde -->
  <g fill="#fff7ed">
    <circle cx="256" cy="220" r="15" />
    <path d="M 178 256 Q 256 206 334 256 Z" />
    <rect x="166" y="250" width="180" height="22" rx="11" />
  </g>

  <!-- Destellos (sazón) -->
  <g fill="#fff7ed">
    <path
      d="M 404 92 Q410 114 432 120 Q410 126 404 148 Q398 126 376 120 Q398 114 404 92 Z"
      fill-opacity="0.95"
    />
    <path
      d="M 108 356 Q112 370 126 374 Q112 378 108 392 Q104 378 90 374 Q104 370 108 356 Z"
      fill-opacity="0.8"
    />
    <path
      d="M 118 132 Q121 142 131 145 Q121 148 118 158 Q115 148 105 145 Q115 142 118 132 Z"
      fill-opacity="0.7"
    />
  </g>
</svg>
